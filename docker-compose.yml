version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: helpdesk_db
    restart: always
    environment:
      MYSQL_DATABASE: helpdesk_db
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_PASSWORD: rootpassword
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: helpdesk_backend
    restart: always
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=helpdesk_db
      - DB_USERNAME=root
      - DB_PASSWORD=rootpassword
      - QUEUE_CONNECTION=database
    volumes:
      - ./backend:/var/www
    depends_on:
      - db

  web:
    image: nginx:alpine
    container_name: helpdesk_web
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./backend:/var/www
      - ./backend/docker/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  queue_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: helpdesk_worker
    restart: always
    command: php artisan queue:work --sleep=3 --tries=3
    volumes:
      - ./backend:/var/www
    environment:
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=helpdesk_db
      - DB_USERNAME=root
      - DB_PASSWORD=rootpassword
      - QUEUE_CONNECTION=database
    depends_on:
      - db

  nlp:
    build:
      context: ./nlp_service
      dockerfile: Dockerfile
    container_name: helpdesk_nlp
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./nlp_service/models:/app/models

volumes:
  db_data:
